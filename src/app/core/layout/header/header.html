<header class="site-header">

  <div class="header-container">

    <!-- Logo -->
    <a routerLink="/" class="logo">

      <span class="logo-mark">

        <svg
          viewBox="0 0 32 32"
          fill="none"
          aria-hidden="true"
        >
          <path
            d="M16 4C10 4 6 9 6 15c0 6 4.5 11 10 13
               5.5-2 10-7 10-13 0-6-4-11-10-11Z"
            stroke="currentColor"
            stroke-width="1.4"
          />

          <path
            d="M16 9v15"
            stroke="currentColor"
            stroke-width="1.4"
          />

          <path
            d="M16 12c-2.5-2-6-2.2-8.4-.6
               C8.6 14.4 11.8 16.6 16 15"
            stroke="currentColor"
            stroke-width="1.2"
          />
        </svg>

      </span>

      <span class="logo-text">
        Harvestly
      </span>

    </a>


    <!-- Navigation -->
    <nav
      class="main-nav"
      aria-label="Primary navigation"
    >

      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        Home
      </a>

      <a
        routerLink="/products"
        routerLinkActive="active"
      >
        Products
      </a>

      <a href="#categories">
        Categories
      </a>

      <a href="#about">
        About
      </a>

    </nav>


    <!-- Actions -->
    <div class="header-actions">

      <!-- Search -->
      <button
        class="icon-btn"
        type="button"
        aria-label="Search"
      >

        <svg
          viewBox="0 0 24 24"
          fill="none"
        >
          <circle
            cx="11"
            cy="11"
            r="6.5"
            stroke="currentColor"
            stroke-width="1.5"
          />

          <path
            d="M20 20l-4-4"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          />
        </svg>

      </button>


      <!-- Cart -->
      <button
        class="cart-btn"
        type="button"
        aria-label="Shopping cart"
        (click)="openCart()"
      >

        <svg
          viewBox="0 0 24 24"
          fill="none"
        >
          <path
            d="M4 8h16l-1.4 10.2
               a2 2 0 0 1-2 1.8H7.4
               a2 2 0 0 1-2-1.8L4 8Z"
            stroke="currentColor"
            stroke-width="1.5"
          />

          <path
            d="M8.5 8V6.5a3.5 3.5 0 0 1 7 0V8"
            stroke="currentColor"
            stroke-width="1.5"
          />
        </svg>

        <span class="cart-count">
          {{ cartService.totalItems() }}
        </span>

      </button>


      <!-- Login -->
      <a
        routerLink="/login"
        class="login-btn"
      >

        <svg
          viewBox="0 0 24 24"
          fill="none"
        >
          <circle
            cx="12"
            cy="8"
            r="3.4"
            stroke="currentColor"
            stroke-width="1.5"
          />

          <path
            d="M4.8 19.2
               c1.6-3 4-4.4 7.2-4.4
               s5.6 1.4 7.2 4.4"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          />

        </svg>

        <span>
          Login
        </span>

      </a>

    </div>

  </div>

</header>
