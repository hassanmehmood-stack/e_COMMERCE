<div class="auth-page">

  <div class="auth-card">

    <div class="auth-brand">

      <div class="brand-icon">
        <span>H</span>
      </div>

      <h2>Harvestly</h2>

      <p>Welcome back to your account</p>

    </div>


    <p
      class="form-success"
      *ngIf="successMessage()"
    >
      {{ successMessage() }}
    </p>


    <form
      [formGroup]="loginForm"
      (ngSubmit)="onSubmit()"
      class="auth-form"
    >

      <!-- Email -->
      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="you@example.com"
          [class.invalid]="
            f['email'].touched &&
            f['email'].invalid
          "
        />

        <span
          class="field-error"
          *ngIf="
            f['email'].touched &&
            f['email'].errors?.['required']
          "
        >
          Email is required
        </span>

        <span
          class="field-error"
          *ngIf="
            f['email'].touched &&
            f['email'].errors?.['email']
          "
        >
          Enter a valid email address
        </span>

      </div>


      <!-- Password -->
      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Enter your password"
          [class.invalid]="
            f['password'].touched &&
            f['password'].invalid
          "
        />

        <span
          class="field-error"
          *ngIf="
            f['password'].touched &&
            f['password'].errors?.['required']
          "
        >
          Password is required
        </span>

      </div>


      <!-- Firebase / Login Error -->
      <p
        class="form-error"
        *ngIf="errorMessage()"
      >
        {{ errorMessage() }}
      </p>


      <!-- Submit -->
      <button
        type="submit"
        class="submit-btn"
        [disabled]="isLoading()"
      >
        {{ isLoading() ? 'Please wait...' : 'Log In' }}
      </button>

    </form>


    <!-- Signup -->
    <p class="switch-link">

      Don't have an account?

      <a routerLink="/signup">
        Sign up
      </a>

    </p>

  </div>

</div>
