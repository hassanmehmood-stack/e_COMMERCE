<section class="add-product-page">
  <div class="container">
    <div class="page-header">
      <div>
        <span class="admin-badge">Admin Panel</span>
        <h1>Add Product</h1>
        <p>Add a new product to your store.</p>
      </div>
      <button type="button" class="back-btn" routerLink="/admin">
        ← Back to Products
      </button>
    </div>

    <div class="form-card">

      @if(successMessage()){
        <div class="success-message toast" role="status">
          {{successMessage()}}
        </div>
      }

      @if(errorMessage()){
        <div class="error-message">
          {{errorMessage()}}
        </div>
      }

      <form [formGroup]="productForm" (ngSubmit)="onSubmit()">

        <div class="form-grid">

          <div class="form-group full">
            <label for="name">
              Product Name
            </label>
            <input
              id="name"
              type="text"
              formControlName="name"
              placeholder="Enter product name"
            />

            @if(f.name.touched && f.name.invalid){
              <small class="field-error">
                Product name is required
              </small>
            }
          </div>

          <div class="form-group">
            <label for="price">
              Price
            </label>

            <div class="input-wrapper">
              <span class="input-prefix">
                PKR
              </span>

              <input
                id="price"
                type="number"
                formControlName="price"
                placeholder="0"
                min="0"
              />
            </div>

            @if(f.price.touched && f.price.invalid){
              <small class="field-error">
                Price must be greater than 0
              </small>
            }
          </div>

          <div class="form-group">
            <label for="stock">
              Stock
            </label>

            <input
              id="stock"
              type="number"
              formControlName="stock"
              placeholder="0"
              min="0"
            />
          </div>

          <div class="form-group">
            <label for="category">
              Category
            </label>

            <select
              id="category"
              formControlName="category"
            >
              <option value="">
                Select category
              </option>
              <option value="fruits">
                Fruits
              </option>
              <option value="vegetables">
                Vegetables
              </option>
              <option value="dairy">
                Dairy
              </option>
              <option value="bakery">
                Bakery
              </option>
              <option value="beverages">
                Beverages
              </option>
              <option value="other">
                Other
              </option>
            </select>
          </div>

          <div class="form-group">
            <label for="image">
              Image URL
            </label>

            <input
              id="image"
              type="url"
              formControlName="image"
              placeholder="https://example.com/image.jpg"
            />
          </div>

          <div class="form-group full">
            <label for="description">
              Description
            </label>

            <textarea
              id="description"
              rows="6"
              formControlName="description"
              placeholder="Write a description for your product..."
            ></textarea>
          </div>

        </div>

        <div class="form-actions">

          <button
            type="button"
            class="btn btn-ghost"
            routerLink="/admin"
          >
            Cancel
          </button>

          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="isLoading()"
          >
            @if(isLoading()){
              Adding Product...
            }
            @else{
              Add Product
            }
          </button>

        </div>

      </form>

    </div>

  </div>
</section>
