<section class="products-page">
  @if (successMessage()) {
    <div class="cart-toast" role="status">{{ successMessage() }}</div>
  }

  <div class="container">

    <div class="page-header">

      <h1>
        Our Products
      </h1>

      <p>
        Explore our latest products.
      </p>

    </div>


    <div class="product-grid">


      @for(product of products(); track product.id){


        <div class="product-card">


          <img
            [src]="product.image"
            [alt]="product.name"
          />


          <h3>
            {{product.name}}
          </h3>


          <p>
            {{product.description}}
          </p>


          <div class="product-footer">


            <span>
              PKR {{product.price}}
            </span>


            <button type="button" (click)="addToCart(product)">
              Add To Cart
            </button>


          </div>


        </div>


      }


    </div>


  </div>

</section>
